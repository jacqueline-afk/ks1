<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kanaka Skills Loops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
  Kanaka Skills Loops
  This page holds no student data. It draws three loops from URL parameters:
    f = confirmed segments, comma separated (example: f=1.1,1.3,2.3)
    p = segments pending kumu confirmation (example: p=3.3)
    demo=1 shows an example with every loop closed
*/
:root {
  --bg: #000000;
  --surface: #151515;
  --track: #2A2A2A;
  --text: #F2F2F2;
  --muted: #9A9A9A;
  --line: #262626;
  --makawalu: #47ADB8;
  --hoapaio: #B763B5;
  --kupaa: #B9BC7E;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.5;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 20px; }
svg { width: 100%; height: auto; display: block; }
.hit { cursor: pointer; outline: none; }
.hit:focus-visible { stroke: rgba(255, 255, 255, 0.25); }
.badge { cursor: pointer; }
.key { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 6px 0 14px; font-size: 13px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; }
.panel { background: var(--surface); border-radius: 12px; padding: 16px 18px; min-height: 132px; }
.panel h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; }
.panel .sub { margin: 2px 0 10px; color: var(--muted); font-size: 13px; }
.panel p { margin: 0 0 8px; }
.panel .status { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
.panel .hint { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="loops" viewBox="0 0 600 236" role="img" aria-label="Kanaka Skills loops"></svg>
  <div class="key" aria-hidden="true">
    <span><i style="background:var(--text)"></i>Filled</span>
    <span><i style="background:var(--text);opacity:.4"></i>Pending kumu</span>
    <span><i style="background:var(--track)"></i>Open</span>
  </div>
  <div class="panel" id="panel" aria-live="polite"></div>
</div>
<script>
const STRANDS = [
  { key: "1", icon: "M", name: "Makawalu", english: "Creative Critical Thinker", color: "var(--makawalu)",
    desc: "Looking at things from different perspectives by collaborating with others to gain knowledge.",
    items: {
      "1.1": "I can engage in learning from, with, and for my peers, community, and others.",
      "1.2": "I can collect and summarize information from my observations, conversations, participation, research, and reflection.",
      "1.3": "I can interpret ideas and information from multiple perspectives.",
      "1.4": "I can be resilient and flexible in finding alternative perspectives, pathways, and ways of thinking when faced with obstacles.",
      "1.5": "I can identify when it is appropriate to lead and when it is appropriate to follow." } },
  { key: "2", icon: "H", name: "Hoa Paio", english: "Conscious Collaborator", color: "var(--hoapaio)",
    desc: "Friend in the struggle: understanding that the natural state of learning is often a struggle but there are tools that can support success.",
    items: {
      "2.1": "I can grow in my ability to listen and follow directions.",
      "2.2": "I can activate self-discipline in all situations by embracing my kuleana.",
      "2.3": "I can support others in order to achieve our collective goals and overcome adversity together.",
      "2.4": "I can view confusion and mistakes as part of the journey to the development of new and original ideas.",
      "2.5": "I can make the connection between my choices today and the benefits and/or consequences for the future." } },
  { key: "3", icon: "K", name: "Kūpaʻa", english: "Confident Communicator", color: "var(--kupaa)",
    desc: "Standing firm from a foundation of knowledge and confidence that has come from learning and experiences.",
    items: {
      "3.1": "I can share the moʻolelo and understanding of myself, my place, my people, and my cultural practices.",
      "3.2": "I can express my values, beliefs, and perspectives confidently.",
      "3.3": "I can draw personal strength and confidence from my knowledge and connection to my past.",
      "3.4": "I can integrate my passions and emotions intentionally into my thinking as a way of striving for creativity and intellectual rigor.",
      "3.5": "I can create an organized and compelling learning artifact that inspires deeper understanding and/or change." } }
];

// Semi-abstract badge icons in a 100 x 100 box.
const ICONS = {
  // ʻIwa soaring and seeing far, with three small eyes for many perspectives
  M: '<path d="M50 36 L56 43 L68 29 L95 39 L70 37 L58 51 L61 74 L52 62 L50 67 L48 62 L39 74 L42 51 L30 37 L5 39 L32 29 L44 43 Z"/><circle cx="34" cy="84" r="3.2"/><circle cx="50" cy="84" r="3.2"/><circle cx="66" cy="84" r="3.2"/>',
  // Two rows of niho facing and interlocking, friends meeting in the struggle
  H: '<rect x="12" y="20" width="76" height="4" rx="1"/><path d="M13 27 L31 27 L22 49 Z M32 27 L50 27 L41 49 Z M51 27 L69 27 L60 49 Z M70 27 L88 27 L79 49 Z"/><path d="M22.5 75 L40.5 75 L31.5 53 Z M41 75 L59 75 L50 53 Z M59.5 75 L77.5 75 L68.5 53 Z"/><rect x="12" y="78" width="76" height="4" rx="1"/>',
  // Nested peaks on a firm base, layers of knowledge standing steady
  K: '<path fill-rule="evenodd" d="M12 76 L50 16 L88 76 Z M28 76 L50 41 L72 76 Z M40 76 L50 60 L60 76 Z"/><rect x="8" y="80" width="84" height="4" rx="1"/>'
};

// ---- Read segments from the URL. Only valid indicator codes are accepted. ----
const VALID = new Set(STRANDS.flatMap(s => Object.keys(s.items)));
const params = new URLSearchParams(location.search);
const parseList = v => new Set((v || "").split(/[\s,;|]+/).map(x => x.trim()).filter(x => VALID.has(x)));
let filled = parseList(params.get("f"));
let pending = parseList(params.get("p"));
if (params.get("demo") === "1") { filled = new Set(VALID); pending = new Set(); }
pending.forEach(x => { if (filled.has(x)) pending.delete(x); });

const statusOf = id => filled.has(id) ? "filled" : pending.has(id) ? "pending" : "open";
const STATUS_LABEL = { filled: "Filled", pending: "Pending kumu confirmation", open: "Open" };

// ---- Drawing ----
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("loops");
const panel = document.getElementById("panel");
const R = 76, W = 20, CY = 100, HAIR = 1.5;
let pinned = null;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function arc(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.cos((a - 90) * Math.PI / 180), cy + r * Math.sin((a - 90) * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M ${x0} ${y0} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}

function draw() {
  svg.innerHTML = "";
  const gap = HAIR / R * 180 / Math.PI;
  STRANDS.forEach((s, si) => {
    const cx = 100 + si * 200;
    const ids = Object.keys(s.items);
    // filled first, then pending, then open, so the loop fills clockwise from the top
    const order = [...ids.filter(i => statusOf(i) === "filled"), ...ids.filter(i => statusOf(i) === "pending"), ...ids.filter(i => statusOf(i) === "open")];
    const g = el("g", {}, svg);
    order.forEach((id, i) => {
      const st = statusOf(id);
      const a0 = i * 72 + gap / 2, a1 = (i + 1) * 72 - gap / 2;
      el("path", { d: arc(cx, CY, R, a0, a1), fill: "none", "stroke-width": W,
        stroke: st === "open" ? "var(--track)" : s.color, "stroke-opacity": st === "pending" ? 0.4 : 1, "pointer-events": "none" }, g);
      const hit = el("path", { class: "hit", d: arc(cx, CY, R, i * 72 + 0.01, (i + 1) * 72 - 0.01), fill: "none",
        stroke: "transparent", "stroke-width": W + 6, "pointer-events": "stroke", tabindex: "0", role: "button",
        "aria-label": `${s.name} ${id}, ${STATUS_LABEL[st]}: ${s.items[id]}` }, g);
      bind(hit, { si, id });
    });
    const done = ids.every(i => filled.has(i));
    if (done) {
      const b = el("g", { class: "badge", tabindex: "0", role: "button", "aria-label": `${s.name} badge earned` }, g);
      el("circle", { cx, cy: CY, r: R - W / 2 - 7, fill: s.color, "fill-opacity": 0.14, stroke: s.color, "stroke-width": 1 }, b);
      const icon = el("g", { fill: s.color, transform: `translate(${cx - 44} ${CY - 44}) scale(0.88)` }, b);
      icon.innerHTML = ICONS[s.icon];
      bind(b, { si, id: null });
    }
    const lb = el("text", { x: cx, y: CY + R + W / 2 + 26, "text-anchor": "middle", fill: s.color, "font-size": 16, "font-weight": 700 }, g);
    lb.textContent = s.name;
    const en = el("text", { x: cx, y: CY + R + W / 2 + 45, "text-anchor": "middle", fill: "var(--muted)", "font-size": 12.5 }, g);
    en.textContent = s.english;
  });
  const n = filled.size;
  svg.setAttribute("aria-label", `Kanaka Skills loops: ${n} of 15 segments filled${pending.size ? `, ${pending.size} pending kumu confirmation` : ""}.`);
}

function bind(node, view) {
  node.addEventListener("mouseenter", () => { if (!pinned) show(view); });
  node.addEventListener("mouseleave", () => { if (!pinned) show(null); });
  node.addEventListener("focus", () => show(view));
  node.addEventListener("click", () => { pinned = pinned && pinned.si === view.si && pinned.id === view.id ? null : view; show(pinned); });
  node.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); node.dispatchEvent(new Event("click")); } });
}

function show(v) {
  if (!v) {
    const n = filled.size;
    panel.innerHTML = `<h2>Kanaka Skills loops</h2>
      <p class="sub">${n} of 15 segments filled${pending.size ? `, ${pending.size} pending kumu confirmation` : ""}</p>
      <p class="hint">Each loop is one strand, and each segment is one "I can" statement. Five filled segments close the loop and earn the badge. Tap a segment to read it.</p>`;
    return;
  }
  const s = STRANDS[v.si];
  const got = Object.keys(s.items).filter(i => filled.has(i)).length;
  if (!v.id) {
    panel.innerHTML = `<h2 style="color:${s.color}">${s.name}${got === 5 ? " badge earned" : ""}</h2>
      <p class="sub">${s.english} · ${got} of 5 filled</p>
      <p>${s.desc}</p>`;
    return;
  }
  const st = statusOf(v.id);
  const chip = st === "open" ? "background:var(--track);color:var(--muted)" : st === "pending" ? `background:transparent;color:${s.color};border:1px solid ${s.color}` : `background:${s.color};color:#000`;
  panel.innerHTML = `<h2 style="color:${s.color}">${s.name} ${v.id}</h2>
    <p class="sub">${s.english} · ${got} of 5 filled</p>
    <span class="status" style="${chip}">${STATUS_LABEL[st]}</span>
    <p>${s.items[v.id]}</p>`;
}

draw();
show(null);
</script>
</body>
</html>
